name: Recolectar vacantes
on:
  schedule:
    # GitHub suele atrasar los horarios varias horas; por eso hay dos vueltas al día
    # y la base importa cada 2 horas (solo si el archivo cambió). La tarea supervisora
    # además lanza el robot a mano a las 6:43 a. m.
    - cron: "7 10 * * *"   # 6:07 a. m. RD
    - cron: "7 19 * * *"   # 3:07 p. m. RD
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás (Aldaba)"
        default: "3"
jobs:
  recolectar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/recolectar.mjs
        env:
          DIAS: ${{ inputs.dias || '3' }}
      - run: |
          git config user.name "Recolector Enlace Laboral"
          git config user.email "bot@enlacelaboralrd.com"
          git add carga/auto-latest.json carga/auto-resumen.json
          git commit -m "Recolector: vacantes del día [skip ci]" || echo "sin cambios"
          git pull --rebase -X theirs origin main || true
          git push
