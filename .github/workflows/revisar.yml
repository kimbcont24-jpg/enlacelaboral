name: Salud de Enlace Laboral
on:
  schedule:
    # 5:37 a. m. RD (GitHub suele atrasarlo; la vigilancia lo lee a las 8:17 a. m.)
    - cron: "37 9 * * *"
  workflow_dispatch:
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/revisar.mjs
      - run: |
          git config user.name "Revisor Enlace Laboral"
          git config user.email "bot@enlacelaboralrd.com"
          git add carga/salud.json
          git commit -m "Salud del día [skip ci]" || echo "sin cambios"
          git pull --rebase -X theirs origin main || true
          git push
